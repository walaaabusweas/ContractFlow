[project]
name = "contractflow"
version = "0.1.0"
description = "AI-Powered Contract Review Support Assistant using LangGraph, RAG, and pgvector"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Walaa", email = "your.email@example.com"}
]

# الاعتماديات الأساسية للمشروع (Core Dependencies)
dependencies = [
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-community>=0.3.0",
    "langchain-text-splitters>=0.0.1",
    
    # Vector DB & Embeddings
    "chromadb>=0.5.0",
    "cohere>=5.0.0",
    "redis>=5.0.1",

    # LlamaIndex Integration
    "llama-index>=0.10.0",
    "llama-index-core>=0.10.0",
    "llama-index-readers-file>=0.1.0",
    "llama-index-vector-stores-chroma>=0.1.0",
    
    # API & Server
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "requests>=2.31.0",
    "dashscope>=1.20.0",
    
    # Document Processing
    "pypdf>=4.1.0",
    "tiktoken>=0.6.0",
    "python-dotenv>=1.0.1",
    "huggingface-hub>=0.23.0",
    "gradio>=4.0.0"

]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

# إعدادات إضافية لضمان توافق البيئة مع Mac M1
[tool.uv]
native-tls = true
